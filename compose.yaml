services:
  backend:
    build: ./backend
    container_name: final-backend
    mem_limit: 128m
    environment:
      APP_ENV: production
      APP_VERSION: "1.0"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: final-nginx
    ports:
      - "8089:80"
    depends_on:
      - backend
    restart: unless-stopped
